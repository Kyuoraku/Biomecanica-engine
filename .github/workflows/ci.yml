name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm mutation
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm evidence
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: |
            screenshots/
            playwright-report/
          if-no-files-found: ignore
